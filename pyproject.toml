[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "lcl-dtou-causal"
version = "0.1.0"
description = "Pre-registered difference-in-differences and event study of the Low Carbon London dynamic time-of-use tariff trial"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Avinash Nagarajan" }]
dependencies = [
    "duckdb==2.0.0",
    "pandas==3.1.0",
    "pyarrow==26.0.0",
    "numpy==2.5.4",
    "statsmodels==0.15.0",
    "linearmodels==7.1",
    "scipy==1.18.1",
    "matplotlib==3.11.2",
    "openpyxl==3.1.5",
]

[project.optional-dependencies]
dev = ["pytest==9.2.0", "ruff==0.17.3"]
llm = ["anthropic>=0.40", "httpx>=0.27"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B905"]
